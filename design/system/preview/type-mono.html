<!DOCTYPE html>
<!-- @dsCard group="Type" name="Mono — Micro-labels" subtitle="JetBrains Mono, uppercase, 0.18em tracking" viewport="700x260" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: var(--bg-1); }
  .card { padding: 28px 32px; font-family: var(--font-sans); color: var(--fg-1); }
  .row { display: grid; grid-template-columns: 100px 1fr 90px; align-items: baseline; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .lbl { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.18em; color: var(--fg-muted); }
  .spec { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; color: var(--fg-muted); text-align: right; }
  .row.head { border-bottom: 1px solid var(--ink-900); padding-bottom: 6px; margin-bottom: 4px; }
  .row.head .lbl { color: var(--fg-1); }
  .micro { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.18em; color: var(--fg-1); }
  .meta { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--fg-muted); }
</style>
</head>
<body>
<div class="card">
  <div class="row head"><span class="lbl">/ Mono</span><span class="lbl">JetBrains Mono · widely tracked · ALL CAPS for labels</span><span class="spec">SIZE</span></div>
  <div class="row"><span class="lbl">eyebrow</span><span class="micro">/ 04 &nbsp;Selected Projects</span><span class="spec">11.2 / 1.5</span></div>
  <div class="row"><span class="lbl">tag</span><span class="micro">React · TypeScript · API</span><span class="spec">11.2 / 1.5</span></div>
  <div class="row"><span class="lbl">metadata</span><span class="meta">2023 — 2027 (expected)</span><span class="spec">11.2 / 1.5</span></div>
  <div class="row"><span class="lbl">numeric</span><span class="meta">01 &nbsp; 02 &nbsp; 03 &nbsp; 04 &nbsp; 05 &nbsp; 06</span><span class="spec">11.2 / 1.5</span></div>
</div>
</body>
</html>
