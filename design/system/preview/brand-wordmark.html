<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Wordmark" subtitle="Wei. — echoing the Wabash. wordmark" viewport="700x240" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: var(--bg-1); }
  .card { padding: 32px; font-family: var(--font-sans); color: var(--fg-1); display: flex; align-items: center; gap: 36px; }
  .mark {
    font-family: var(--font-display); font-weight: 400; letter-spacing: -0.02em;
    font-size: 100px; line-height: 0.92; color: var(--red-500);
  }
  .meta { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 14px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--rule); }
  .k { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.18em; color: var(--fg-muted); width: 80px; }
  .v { font-family: var(--font-mono); font-size: 11px; color: var(--fg-1); }
</style>
</head>
<body>
<div class="card">
  <div class="mark">Wei.</div>
  <div class="meta">
    <div class="row"><span class="k">Mark</span><span class="v">Word + period, all red</span></div>
    <div class="row"><span class="k">Type</span><span class="v">Girga, -0.02em</span></div>
    <div class="row"><span class="k">Inspired</span><span class="v">Wabash. wordmark</span></div>
    <div class="row"><span class="k">Inverse</span><span class="v">red → white on black bg</span></div>
  </div>
</div>
</body>
</html>
