<!DOCTYPE html>
<!-- @dsCard group="Type" name="Alfa Slab One — Display" subtitle="Free OFL, single heavy weight, all display + wordmark" viewport="700x220" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: var(--bg-1); }
  .card { padding: 32px; font-family: var(--font-sans); color: var(--fg-1); display: flex; align-items: center; gap: 36px; }
  .word {
    font-family: var(--font-display); font-weight: 400; letter-spacing: -0.005em; color: var(--fg-1);
    line-height: 0.92;
  }
  .word .dot { color: var(--red-500); }
  .stack { display: flex; flex-direction: column; gap: 0; }
  .row { display: flex; align-items: baseline; gap: 18px; padding: 8px 0; border-bottom: 1px solid var(--rule); width: 260px; }
  .row:last-child { border-bottom: 0; }
  .key { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.18em; color: var(--fg-muted); width: 80px; }
  .val { font-family: var(--font-mono); font-size: 11px; color: var(--fg-1); }
</style>
</head>
<body>
<div class="card">
  <div class="word" style="font-size: 110px;">Aa<span class="dot">.</span></div>
  <div class="stack">
    <div class="row"><span class="key">Family</span><span class="val">Alfa Slab One</span></div>
    <div class="row"><span class="key">License</span><span class="val">OFL — free</span></div>
    <div class="row"><span class="key">Weight</span><span class="val">single (400)</span></div>
    <div class="row"><span class="key">Tracking</span><span class="val">-0.005em</span></div>
    <div class="row"><span class="key">Use for</span><span class="val">All display + wordmark</span></div>
  </div>
</div>
</body>
</html>
