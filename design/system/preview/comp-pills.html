<!DOCTYPE html>
<!-- @dsCard group="Components" name="Status Pills & Tags" subtitle="Open/filled marker pills + project tags" viewport="700x200" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: var(--bg-1); }
  .card { padding: 32px; font-family: var(--font-sans); color: var(--fg-1); display: flex; flex-direction: column; gap: 16px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.18em; color: var(--fg-muted); }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--rule);
    font-family: var(--font-mono); font-size: 11.2px; text-transform: uppercase; letter-spacing: 0.18em;
    color: var(--ink-900);
  }
  .pill .dot { color: var(--accent); font-size: 14px; }
  .tag {
    font-family: var(--font-mono); font-size: 11.2px; text-transform: uppercase; letter-spacing: 0.18em;
    color: var(--fg-muted);
    padding: 4px 8px; border: 1px solid var(--rule);
  }
</style>
</head>
<body>
<div class="card">
  <div class="lbl">/ Status pill &amp; tags</div>
  <div class="row">
    <span class="pill"><span class="dot">◍</span>&nbsp;Available for opportunities</span>
    <span class="pill"><span class="dot">●</span>&nbsp;Currently writing</span>
  </div>
  <div class="row">
    <span class="tag">React</span>
    <span class="tag">TypeScript</span>
    <span class="tag">Python</span>
    <span class="tag">Algorithms</span>
    <span class="tag">Tool</span>
  </div>
</div>
</body>
</html>
