<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Paper & Surface" subtitle="White paper, warm-gray steps" viewport="700x180" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: var(--bg-1); }
  .card { padding: 28px 32px; font-family: var(--font-sans); color: var(--fg-1); }
  .row { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 14px; }
  .swatch { flex: 1; height: 88px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px 12px; border: 1px solid var(--rule); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); letter-spacing: 0.08em; }
  .name { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.18em; color: var(--fg-2); margin-bottom: 2px; }
  .lbl { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.18em; color: var(--fg-muted); margin-bottom: 8px; }
</style>
</head>
<body>
<div class="card">
  <div class="lbl">/ Paper &amp; Surface (white-based, warm-gray steps)</div>
  <div class="row">
    <div class="swatch" style="background:#FFFFFF"><span class="name">paper</span><span class="hex">#FFFFFF</span></div>
    <div class="swatch" style="background:#FAFAF9"><span class="name">paper-50</span><span class="hex">#FAFAF9</span></div>
    <div class="swatch" style="background:#F5F4F2"><span class="name">paper-100</span><span class="hex">#F5F4F2</span></div>
    <div class="swatch" style="background:#ECEAE6"><span class="name">paper-200</span><span class="hex">#ECEAE6</span></div>
    <div class="swatch" style="background:#D9D6D1"><span class="name">paper-300</span><span class="hex">#D9D6D1</span></div>
  </div>
</div>
</body>
</html>
