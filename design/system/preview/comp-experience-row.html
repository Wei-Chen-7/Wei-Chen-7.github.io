<!DOCTYPE html>
<!-- @dsCard group="Components" name="Experience Row" subtitle="When · what · where · tags — single row" viewport="700x180" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: var(--bg-1); }
  .card { padding: 28px 32px; font-family: var(--font-sans); color: var(--fg-1); }
  .lbl { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.18em; color: var(--fg-muted); margin-bottom: 14px; }
  .row { display: grid; grid-template-columns: 140px 1fr 80px; gap: 18px; padding: 14px 0; border-bottom: 1px solid var(--rule); align-items: baseline; }
  .row:last-of-type { border-bottom: 0; }
  .when { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.18em; color: var(--fg-muted); }
  .where { font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); letter-spacing: 0.18em; text-transform: uppercase; margin-top: 4px; }
  .title { font-family: var(--font-serif); font-weight: 300; font-size: 22px; letter-spacing: -0.02em; color: var(--fg-1); line-height: 1.2; }
  .at { color: var(--fg-muted); }
  .desc { font-family: var(--font-sans); font-size: 13px; color: var(--fg-2); margin-top: 8px; line-height: 1.5; }
  .tag {
    font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.18em;
    color: var(--fg-muted); padding: 3px 7px; border: 1px solid var(--rule); display: inline-block;
  }
  .tags { display: flex; justify-content: flex-end; gap: 6px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="card">
  <div class="lbl">/ Experience row</div>
  <div class="row">
    <div>
      <div class="when">Summer 2025</div>
      <div class="where">[City, ST]</div>
    </div>
    <div>
      <div class="title">[Internship or Role Title] <span class="at">· [Company Name]</span></div>
      <div class="desc">One sentence about what you built, who it was for, and the outcome.</div>
    </div>
    <div class="tags"><span class="tag">Python</span><span class="tag">TS</span></div>
  </div>
</div>
</body>
</html>
