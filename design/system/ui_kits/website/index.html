<!DOCTYPE html>
<!-- @dsCard group="UI Kit — Website" name="Personal Website — UI Kit" subtitle="Clickable demo: nav, hero, sections, theme toggle" viewport="1280x900" -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wei. — Portfolio · MMXXVI</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="Primitives.jsx"></script>
  <script type="text/babel" src="TopNav.jsx"></script>
  <script type="text/babel" src="SectionHead.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="About.jsx"></script>
  <script type="text/babel" src="Education.jsx"></script>
  <script type="text/babel" src="Experience.jsx"></script>
  <script type="text/babel" src="Projects.jsx"></script>
  <script type="text/babel" src="Skills.jsx"></script>
  <script type="text/babel" src="Writing.jsx"></script>
  <script type="text/babel" src="Contact.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SECTION_IDS = {
      Top: 'top', About: 'about', Education: 'education', Work: 'work',
      Projects: 'projects', Skills: 'skills', Writing: 'writing', Contact: 'contact'
    };

    function App() {
      const [theme, setTheme] = useState('light');
      const [active, setActive] = useState('About');

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
      }, [theme]);

      // Scrollspy
      useEffect(() => {
        const sectionEls = Object.entries(SECTION_IDS)
          .map(([k, id]) => ({ k, el: document.getElementById(id) }))
          .filter((s) => s.el);
        const onScroll = () => {
          const y = window.scrollY + 200;
          let current = sectionEls[0]?.k;
          for (const s of sectionEls) {
            if (s.el.offsetTop <= y) current = s.k;
          }
          if (current && current !== 'Top') setActive(current);
        };
        onScroll();
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      const onNav = (label) => {
        const id = SECTION_IDS[label] || 'top';
        const el = document.getElementById(id);
        if (!el) return;
        const y = el.getBoundingClientRect().top + window.scrollY - 80;
        window.scrollTo({ top: y, behavior: 'smooth' });
      };

      const toggleTheme = () => setTheme((t) => (t === 'light' ? 'dark' : 'light'));

      return (
        <React.Fragment>
          <TopNav active={active} onNav={onNav} theme={theme} onToggleTheme={toggleTheme} />
          <main>
            <Hero available={true} onScrollTo={onNav} />
            <About />
            <Education />
            <Experience />
            <Projects />
            <Skills />
            <Writing />
            <Contact />
            <Footer />
          </main>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
